<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Faruk Connect – অ্যাডমিন প্যানেল</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#040A1C;--line:rgba(120,160,255,.18);--blue:#2F7BFF;--cyan:#27D3F5;--gold:#F6C445;--text:#EAF0FF;--muted:#9BB0DA}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);color:var(--text);font-family:"Hind Siliguri",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
/* ===== ADMIN PANEL ===== */
#adm{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);z-index:1000;display:none;flex-direction:column;
  background:#091230;border-left:1px solid var(--line);box-shadow:-24px 0 70px rgba(0,0,0,.65);font-size:15px}
#adm.open{display:flex}
#adm *{font-family:"Hind Siliguri",system-ui,sans-serif}
.adm-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:#0c1a42}
.adm-head b{font-size:17px;flex:1}
.adm-head small{color:#7fe3a1;font-size:12.5px;opacity:0;transition:opacity .3s}
.adm-head small.on{opacity:1}
.adm-x{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;font-size:18px;cursor:pointer}
.adm-tabs{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.adm-tabs button{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted);font-weight:600;cursor:pointer}
.adm-tabs button.on{background:linear-gradient(135deg,var(--blue),#1d5be0);color:#fff;border-color:transparent}
.adm-body{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.adm-body h4{margin:18px 0 10px;font-size:15px;color:var(--gold);letter-spacing:.2px}
.adm-body h4:first-child{margin-top:0}
.adm-note{font-size:13px;color:var(--muted);line-height:1.55;margin:-4px 0 12px}
.fld{display:grid;gap:5px;margin-bottom:12px}
.fld>label{font-size:13px;color:var(--cyan)}
.fld input[type=text],.fld input[type=number],.fld input[type=password],.fld input[type=url],.fld select,.fld textarea{
  width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;font-size:16px;outline:none}
.fld textarea{min-height:120px;resize:vertical;line-height:1.6}
.fld select option{color:#000}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,123,255,.25)}
.fld.chk{display:flex;align-items:center;gap:10px}
.fld.chk input{width:20px;height:20px;accent-color:var(--blue)}
.fld.chk label{color:var(--text);font-size:15px}
.fld input[type=color]{width:100%;height:44px;border:1px solid var(--line);border-radius:12px;background:transparent;padding:3px}
.imgf{display:grid;gap:8px}
.imgf .pv{height:90px;border-radius:12px;border:1px dashed var(--line);background:rgba(255,255,255,.04) center/cover no-repeat;display:grid;place-items:center;color:var(--muted);font-size:13px}
.imgf .pv.sq{width:90px}
.imgf .row{display:flex;gap:8px;flex-wrap:wrap}
.abtn{padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:#fff;font-weight:600;font-size:14px;cursor:pointer}
.abtn.pri{background:linear-gradient(135deg,var(--blue),#1d5be0);border-color:transparent}
.abtn.gold{background:linear-gradient(135deg,var(--gold),#ff9d2e);color:#1a1200;border-color:transparent}
.abtn.red{background:rgba(255,60,80,.15);border-color:rgba(255,80,100,.5);color:#ffb3bd}
.abtn.full{width:100%;margin-bottom:10px;padding:13px}
.lst{display:grid;gap:10px;margin-bottom:12px}
details.it{border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.04)}
details.it>summary{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;list-style:none}
details.it>summary::-webkit-details-marker{display:none}
details.it>summary>span:first-child{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
details.it>.in-body{padding:4px 12px 2px;border-top:1px solid var(--line);padding-top:12px}
.ctl{display:flex;gap:4px}
.ctl button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:#fff;cursor:pointer}
.ctl button.d{color:#ff9aa7}
.adm-login{padding:28px 20px}
.adm-login h3{font-size:20px;margin-bottom:6px}
#admToast{position:fixed;left:50%;bottom:22px;translate:-50% 0;z-index:1100;padding:10px 18px;border-radius:999px;background:#0c1a42;border:1px solid var(--line);color:#fff;font-size:14px;display:none}
#admToast.on{display:block}
#admToast.err{border-color:#ff6b7d;color:#ffb3bd}
@media (min-width:900px){ body.adm-open{padding-right:460px} }

/* ===== dashboard ===== */
.dash-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.dash-top b{font-size:17px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.kpi{padding:14px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(47,123,255,.22),rgba(255,255,255,.04))}
.kpi small{display:block;color:var(--muted);font-size:13px}
.kpi b{display:block;font-family:Sora,"Hind Siliguri",sans-serif;font-size:28px;line-height:1.2;margin-top:2px}
.kpi.g{background:linear-gradient(160deg,rgba(246,196,69,.25),rgba(255,255,255,.04))}
.kpi.c{background:linear-gradient(160deg,rgba(39,211,245,.22),rgba(255,255,255,.04))}
.dbox{padding:14px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.04);margin-bottom:14px}
.dbox h5{font-size:14px;color:var(--gold);margin-bottom:10px}
.chart{display:flex;align-items:flex-end;gap:5px;height:130px}
.chart .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.chart .bar{width:100%;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--cyan),var(--blue));min-height:2px}
.chart .col span{font-size:10.5px;color:var(--muted);margin-top:4px}
.chart .col em{font-style:normal;font-size:10.5px;color:#fff;margin-bottom:2px}
.hbar{display:grid;grid-template-columns:110px 1fr 36px;gap:8px;align-items:center;font-size:13.5px;margin-bottom:8px}
.hbar>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar i{display:block;height:8px;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--cyan))}
.hbar .tr{background:rgba(255,255,255,.08);border-radius:99px;height:8px}
.recent{display:grid;gap:6px;font-size:13.5px}
.recent div{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:10px;background:rgba(255,255,255,.04)}
.dash-err{padding:14px;border-radius:14px;border:1px solid rgba(255,100,120,.5);background:rgba(255,60,80,.1);color:#ffc2cb;font-size:14px;line-height:1.6}
pre.rules{white-space:pre-wrap;word-break:break-all;padding:12px;border-radius:12px;background:#050b22;border:1px solid var(--line);font-size:12.5px;color:#bcd2ff;margin:6px 0 10px;font-family:ui-monospace,Menlo,monospace}
ol.steps{padding-left:20px;font-size:14px;line-height:1.75;color:#d5e1ff;margin-bottom:10px}
ol.steps li{margin-bottom:4px}

/* ===== অ্যাপের মতো স্থির স্ক্রিন: জুম/টানাটানি বন্ধ ===== */
html,body{max-width:100%;overflow-x:hidden;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior-x:none;-webkit-tap-highlight-color:transparent}
img{-webkit-user-drag:none;user-select:none}
input,textarea,select{touch-action:manipulation}
.lst{grid-template-columns:minmax(0,1fr)}
details.it{min-width:0;max-width:100%}
details.it>summary>span:first-child{min-width:0}
/* ===== standalone layout ===== */
#adm{right:auto;left:0;border-left:0;border-right:1px solid var(--line);width:min(480px,100%);box-shadow:none}
#pv{position:fixed;top:0;bottom:0;left:480px;right:0;background:#000;z-index:10}
#pv iframe{width:100%;height:100%;border:0;background:#04091c}
#pvClose{display:none}
@media (max-width:899px){
  #pv{display:none;left:0;z-index:1200}
  #pv.open{display:block}
  #pvClose{display:block;position:fixed;right:12px;top:12px;z-index:1300;padding:10px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(5,12,32,.85);color:#fff;font-weight:600;font-size:15px;cursor:pointer}
  #pv:not(.open) #pvClose{display:none}
}
@media (min-width:900px){ .pvbtn{display:none} }
</style>
</head>

4\" height=\"14\" rx=\"3\"/><path d=\"m16 10 6-3v10l-6-3z\"/>',\n  link:'<path d=\"M10 14a4 4 0 0 0 5.700 0l3-3a4 4 0 0 0-5.700-5.700l-1 1M14 10a4 4 0 0 0-5.700 0l-3 3a4 4 0 0 0 5.700 5.700l1-1\"/>',\n  phone:'<path d=\"M22 16.900v3a2 2 0 0 1-2.200 2 19.800 19.800 0 0 1-8.600-3.100 19.500 19.500 0 0 1-6-6A19.800 19.800 0 0 1 2.100 4.200 2 2 0 0 1 4.100 2h3a2 2 0 0 1 2 1.700c.1 1 .4 1.900.7 2.800a2 2 0 0 1-.5 2.100L8.100 9.900a16 16 0 0 0 6 6l1.300-1.300a2 2 0 0 1 2.100-.4c.9.300 1.800.6 2.800.7a2 2 0 0 1 1.700 2z\"/>'\n};\nconst card=(id,title,ic,body)=>`<section class=\"card\" id=\"${id}\"><h2 class=\"h\"><span class=\"ic\"><svg viewBox=\"0 0 24 24\">${SEC_ICON[ic]}<\/svg><\/span>${esc(title)}<\/h2>${body}<\/section>`;\n\n/* =====================================================\n   সাইট রেন্ডার\n   ===================================================== */\n\n/* ---------- ভিডিও এম্বেড (YouTube / Facebook / সরাসরি mp4) ---------- */\nfunction vidEmbed(u){\n  u=(u||'').trim(); if(!u) return null;\n  let m=u.match(/(?:youtu\\.be\\/|youtube\\.com\\/(?:watch\\?(?:[^#]*&)?v=|embed\\/|shorts\\/|live\\/|v\\/))([\\w-]{11})/);\n  if(m) return {t:'yt',id:m[1],tall:/\\/shorts\\//.test(u)};\n  if(/facebook\\.com|fb\\.watch|fb\\.com/i.test(u)) return {t:'fb',u:u,tall:/\\/reel\\//.test(u)};\n  if(/\\.(mp4|webm|ogg)(\\?.*)?$/i.test(u)) return {t:'file',u:u};\n  return {t:'link',u:u};\n}\nfunction vidCard(v){\n  const e=vidEmbed(v.url); if(!e) return '';\n  let body;\n  if(e.t==='yt') body=`<div class=\"vid${e.tall?' tall':''}\"><button type=\"button\" class=\"vid-play\" data-yt=\"${esc(e.id)}\" aria-label=\"ভিডিও চালান\" style=\"background-image:url('https://i.ytimg.com/vi/${esc(e.id)}/hqdefault.jpg')\"><span>▶<\/span><\/button><\/div>`;\n  else if(e.t==='fb') body=`<div class=\"vid${e.tall?' tall':''}\"><iframe src=\"https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(e.u)}&show_text=false&width=560\" loading=\"lazy\" allowfullscreen allow=\"autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share\" title=\"${esc(v.title||'Facebook ভিডিও')}\"><\/iframe><\/div>`;\n  else if(e.t==='file') body=`<div class=\"vid\"><video controls preload=\"metadata\" playsinline src=\"${esc(e.u)}\"><\/video><\/div>`;\n  else body=`<div class=\"vid\"><a class=\"vid-link\" href=\"${esc(e.u)}\" target=\"_blank\" rel=\"noopener\">ভিডিও দেখুন ↗<\/a><\/div>`;\n  return `<div class=\"vcard\">${body}${v.title?`<div class=\"meta\"><b>${esc(v.title)}<\/b><\/div>`:''}<\/div>`;\n}\ndocument.addEventListener('click',e=>{\n  const b=e.target.closest('.vid-play'); if(!b) return;\n  const f=document.createElement('iframe');\n  f.src='https://www.youtube-nocookie.com/embed/'+b.dataset.yt+'?autoplay=1&rel=0&playsinline=1';\n  f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen'; f.allowFullscreen=true; f.title='YouTube ভিডিও';\n  b.replaceWith(f);\n});\n\n\n/* জুম ও পিঞ্চ বন্ধ (iPhone সহ) */\n['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));\ndocument.addEventListener('touchmove',e=>{ if(e.touches.length>1) e.preventDefault(); },{passive:false});\n\n\n/* CV ডাউনলোড (PDF ফাইল ভেতরে থাকলেও ঠিকমতো নামে) */\ndocument.addEventListener('click',e=>{\n  const a=e.target.closest('a[data-cv]'); if(!a) return;\n  const h=a.getAttribute('href')||''; if(h.indexOf('data:')!==0) return;\n  e.preventDefault();\n  try{\n    const bin=atob(h.split(',')[1]), u=new Uint8Array(bin.length);\n    for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);\n    const url=URL.createObjectURL(new Blob([u],{type:'application/pdf'}));\n    const t=document.createElement('a'); t.href=url; t.download=a.dataset.name||'CV.pdf'; document.body.appendChild(t); t.click();\n    setTimeout(()=>{URL.revokeObjectURL(url); t.remove();},2500);\n  }catch(_){ window.open(h,'_blank'); }\n});\n\nlet cur = 0, timer = null, skillsSeen = false;\n\nfunction renderSite(){\n  const c = cfg, p = c.profile, sh = c. '][i%3]}${!src&&host?' lbl':''}${src?' withimg':''}\"${src&&x.bg?` style=\"background:${esc(x.bg)}\"`:''}>${src?`<img class=\"${x.contain?'contain':''}\" src=\"${esc(src)}\" alt=\"${esc(x.title)}\" loading=\"lazy\" onerror=\"this.remove()\">`:(host?`<div class=\"dom\"><b>${esc(x.title)}<\/b><span>${esc(host)}<\/span><em>সাইট দেখুন ↗<\/em><\/div>`:'')}<\/div><div class=\"meta\"><b>${esc(x.title)}<\/b><small>${esc(x.tag)}<\/small><\/div><\/a>`}).join('')}<\/div>`));\n  const vids=(c.videos||[]).filter(v=>(v.url||'').trim());\n  if(sh.videos!==false && vids.length) S.push(card('s-videos','আমার ভিডিও','video',`<div class=\"videos\">${vids.map(vidCard).join('')}<\/div>`));\n  const tl = a => `<ul class=\"tl\">${a.map(e=>`<li class=\"${e.now?'now':''}\"><small>${esc(e.date)}<\/small><b>${esc(e.title)}<\/b><span>${esc(e.sub)}<\/span><\/li>`).join('')}<\/ul>`;\n  const showExp = sh.exp!==false && c.exp.length, showEdu = sh.edu!==false && c.edu.length;\n  if(showExp||showEdu) S.push(`<div class=\"two${showExp&&showEdu?'':' single'}\">${showExp?card('s-exp','অভিজ্ঞতা','brief',tl(c.exp)):''}${showEdu?card('s-edu','শিক্ষা','grad',tl(c.edu)):''}<\/div>`);\n  if(sh.plan!==false && c.plan.length) S.push(card('s-plan','ভবিষ্যৎ পরিকল্পনা','target',`<ul class=\"plan\">${c.plan.map(x=>`<li>${esc(x.text)}<\/li>`).join('')}<\/ul>`));\n  if(sh.hobbies!==false && c.hobbies.length) S.push(card('s-hobbies','শখ ও আগ্রহ','heart',`<div class=\"hobbies\">${c.hobbies.map(x=>`<div class=\"hob\"><span class=\"em\">${esc(x.emoji)}<\/span>${esc(x.label)}<\/div>`).join('')}<\/div>`));\n  const qLinks=c.links.filter(l=>(l.url||'').trim());\n  if(sh.links!==false && qLinks.length) S.push(card('s-links','Quick Links','link',`<nav class=\"links\">${qLinks.map(l=>`<a class=\"link\" href=\"${esc(href(l))}\"${ext(l.url)}><span class=\"dot\" style=\"background:${(ICON[l.icon]||ICON.link).bg}${l.icon==='tiktok'?';border:1px solid rgba(255,255,255,.3)':''}\">${ico(l.icon)}<\/span><span><b>${esc(l.label)}<\/b><small>${esc(l.sub)}<\/small><\/span><span class=\"chev\">›<\/span><\/a>`).join('')}<\/nav>`));\n  const k = c.contact, cl=[];\n  if(k.phone) cl.push(`<div><span>✆<\/span><span><a href=\"tel:${esc(k.phone.replace(/\\s/g,''))}\">${esc(k.phone)}<\/a>${k.phoneNote?`<small>${esc(k.phoneNote)}<\/small>`:''}<\/span><\/div>`);\n  if(k.phone2) cl.push(`<div><span>✆<\/span><span><a href=\"tel:${esc(k.phone2.replace(/\\s/g,''))}\">${esc(k.phone2)}<\/a>${k.phone2Note?`<small>${esc(k.phone2Note)}<\/small>`:''}<\/span><\/div>`);\n  if(k.email) cl.push(`<div><span>✉<\/span><span><a href=\"mailto:${esc(k.email)}\">${esc(k.email)}<\/a>${k.emailNote?`<small>${esc(k.emailNote)}<\/small>`:''}<\/span><\/div>`);\n  if(k.email2) cl.push(`<div><span>✉<\/span><span><a href=\"mailto:${esc(k.email2)}\">${esc(k.email2)}<\/a>${k.email2Note?`<small>${esc(k.email2Note)}<\/small>`:''}<\/span><\/div>`);\n  if(k.address) cl.push(`<div><span>⌖<\/span><span>${esc(k.address)}<\/span><\/div>`);\n  if(sh.contact!==false && cl.length) S.push(card('contact','যোগাযোগ','phone',`<div class=\"contact-list\">${cl.join('')}<\/div>`));\n  if(sh.cv!==false && (c.cv.url||'').trim()) S.push(`<section class=\"card\"><div class=\"cv\"><p><b>${esc(c.cv.title)}<\/b>${esc(c.cv.text)}<\/p><a class=\"btn gold\" data-cv=\"1\" data-name=\"${esc((p.name1+'-'+p.name2+'-CV.pdf').replace(/\\s+/g,'-'))}\" href=\"${esc(href({url:c.cv.url}))}\"${ext(c.cv.url)} download>${esc(c.cv.btn)}<\/a><\/div><\/section>`);\n  $('#flow').innerHTML = S.join('');\n  observeSkills();\n\n  $('#foot').innerHTML = `<div class=\"wrap\"><div class=\"sign\">${esc(c.footer.thanks)}<\/div><small id=\"copy\">${esc(c.footer.copy)}<\/small><\/div>`;\n  buildSlider();\n  const g=document.getElementById('admGear'); if(g) g.style.display=c.hideGear?'none':'';\n}\n\n/* ---------- কভার স্লাইডার ---------- */\n\n/* ---------- ব্যানারে ট্যাপ করলে বড় করে দেখা ---------- */\nlet lbList=[], lbIdx=0;\nfunction lbEnsure(){\n  let lb=document.getElementById('lb'); if(lb) return lb;\n  lb=document.createElement('div'); lb.id='lb'; lb.setAttribute('role','dialog'); lb.setAttribute('aria-modal','true');\n  lb.innerHTML='<button type=\"button\" class=\"lb-x\" aria-label=\"বন্ধ\">✕<\/button><button type=\"button\" class=\"lb-nav prev\" aria-label=\"আগের\">‹<\/button><button type=\"button\" class=\"lb-nav next\" aria-label=\"পরের\">›<\/button><div class=\"lb-box\"><img alt=\"\" draggable=\"false\"><\/div><div class=\"lb-hint\">ছবিতে ট্যাপ করলে বড় হবে<\/div>';\n  document.body.appendChild(lb);\n  const box=lb.querySelector('.lb-box');\n  lb.querySelector('.lb-x').onclick=lbClose;\n  lb.querySelector('.prev').onclick=()=>lbShow(lbIdx-1);\n  lb.querySelector('.next').onclick=()=>lbShow(lbIdx+1);\n  box.querySelector('img').onclick=()=>box.classList.toggle('zoom');\n  lb.addEventListener('click',e=>{ if(e.target===lb||e.target===box) lbClose(); });\n  let x0=null; lb.addEventListener('touchstart',e=>{ x0=e.touches.length===1?e.touches[0].clientX:null; },{passive:true});\n  lb.addEventListener('touchend',e=>{ if(x0==null||box.classList.contains('zoom')) return; const dx=e.changedTouches[0].clientX-x0; if(Math.abs(dx)>60) lbShow(lbIdx+(dx<0?1:-1)); x0=null; },{passive:true});\n  return lb;\n}\nfunction lbShow(n){\n  if(!lbList.length) return; lbIdx=(n+lbList.length)%lbList.length;\n  const lb=lbEnsure(), box=lb.querySelector('.lb-box'); box.classList.remove('zoom');\n  box.querySelector('img').src=lbList[lbIdx].img;\n  lb.classList.toggle('single',lbList.length<2);\n}\nfunction lbOpen(i){\n  lbList=(cfg.banners.items||[]).filter(b=>b.img);\n  const cur=(cfg.banners.items||[])[i]; lbIdx=Math.max(0,lbList.indexOf(cur));\n  lbEnsure().classList.add('open'); lbShow(lbIdx); clearInterval(timer); document.documentElement.style.overflow='hidden';\n}\nfunction lbClose(){ const lb=document.getElementById('lb'); if(lb) lb.classList.remove('open'); document.documentElement.style.overflow=''; restart(); }\ndocument.addEventListener('keydown',e=>{ const lb=document.getElementById('lb'); if(!lb||!lb.classList.contains('open')) return; if(e.key==='Escape') lbClose(); if(e.key==='ArrowRight') lbShow(lbIdx+1); if(e.key==='ArrowLeft') lbShow(lbIdx-1); });\ndocument.addEventListener('click',e=>{ const sl=e.target.closest('.slide.has-img'); if(sl) lbOpen(+sl.dataset.i); });\n\nfunction buildSlider(){\n  const B = cfg.banners, items = B.items||[];\n  const sl = $('#slides'), dt = $('#dots');\n  sl.innerHTML = items.map((b,i)=>b.img?`<div class=\"slide has-img\" data-i=\"${i}\"><img src=\"${esc(b.img)}\" alt=\"${esc(b.title||'ব্যানার')}\" draggable=\"false\"><\/div>`:`<div class=\"slide ${esc(b.scene||'sc1')}\"><div class=\"cap\"><b>${esc(b.title)}<\/b><span>${esc(b.sub)}<\/span><\/div><\/div>`).join('');\n  dt.innerHTML = items.length>1 ? items.map((b,i)=>`<button type=\"button\" aria-label=\"ব্যানার ${i+1}\"><\/button>`).join('') : '';\n  [...dt.children].forEach((d,i)=>d.onclick=()=>{go(i);restart();});\n  go(Math.min(cur,items.length-1));\n  restart();\n}\nfunction go(n){\n  const s=[...$('#slides').children], d=[...$('#dots').children];\n  if(!s.length) return;\n  cur=(n+s.length)%s.length;\n  s.forEach((x,i)=>x.classList.toggle('on',i===cur));\n  d.forEach((x,i)=>x.classList.toggle('on',i===cur));\n}\nfunction restart(){\n  clearInterval(timer);\n  const n=($('#slides').children||[]).length;\n  if(n>1) timer=setInterval(()=>go(cur+1), Math.max(2,+cfg.banners.interval||5)*1000);\n}\n$('#cover').addEventListener('mouseenter',()=>clearInterval(timer));\n$('#cover').addEventListener('mouseleave',restart);\n\n/* ---------- দক্ষতার বার ---------- */\nconst io = new IntersectionObserver(es=>es.forEach(e=>{\n  if(e.isIntersecting){ e.target.classList.add('in'); skillsSeen=true; io.unobserve(e.target); }\n}),{threshold:.2});\nfunction observeSkills(){ const g=$('#skills .skill-grid'); if(g && !skillsSeen) io.observe(g); }\n\n/* ---------- শেয়ার ---------- */\ndocument.addEventListener('click', async e=>{\n  if(!e.target.closest('[data-share]')) return;\n  const data={title:document.title,text:'আমার ডিজিটাল প্রোফাইল দেখুন',url:location.href.split('#')[0]};\n  try{ if(navigator.share) await navigator.share(data); else {await navigator.clipboard.writeText(data.url); toast('লিংক কপি হয়েছে');} }catch(err){}\n});\n\n/* ---------- টোস্ট ---------- */\nfunction toast(msg,err){\n  let t=$('#admToast'); if(!t){t=document.createElement('div');t.id='admToast';document.body.appendChild(t);}\n  t.textContent=msg; t.className='on'+(err?' err':'');\n  clearTimeout(t._t); t._t=setTimeout(()=>t.className='',2600);\n}\n\nrenderSite();\n\n/* ---------- ভিজিটর গণনা (Firebase সংযোগ দেওয়া থাকলেই চালু) ---------- */\n(function(){\n  try{\n    const a=cfg.analytics||{}, u=(a.url||'').trim().replace(/\\/+$/,'');\n    if(!u || !/^https?:/.test(location.protocol) || window.top!==window) return;\n    if(localStorage.getItem('fk_noTrack') || sessionStorage.getItem('fk_sent')) return;\n    sessionStorage.setItem('fk_sent','1');\n    let v=localStorage.getItem('fk_vid');\n    if(!v){ v=Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem('fk_vid',v); }\n    let r=''; try{ if(document.referrer){ r=new URL(document.referrer).hostname.replace(/^www\\./,''); if(r===location.hostname) r=''; } }catch(e){}\n    fetch(u+'/visits.json',{method:'POST',keepalive:true,body:JSON.stringify({t:Date.now(),v:v,d:/Mobi|Android|iPhone/i.test(navigator.userAgent)?'m':'d',r:r})}).catch(()=>{});\n  }catch(e){}\n})();\n\n<\/script>\n<\/body>\n<\/html>\n";

function fld(path,f,val){
  const id='f_'+path.replace(/\./g,'_');
  const L=`<label for="${id}">${esc(f.label)}</label>`;
  const hint=f.hint?`<div class="adm-note" style="margin:0">${f.hint}</div>`:'';
  switch(f.type){
    case 'textarea': return `<div class="fld">${L}<textarea id="${id}" data-path="${path}">${esc(val)}</textarea>${hint}</div>`;
    case 'number': return `<div class="fld">${L}<input id="${id}" type="number" data-path="${path}" data-num="1" value="${esc(val)}"${f.min!=null?` min="${f.min}"`:''}${f.max!=null?` max="${f.max}"`:''}>${hint}</div>`;
    case 'color': return `<div class="fld">${L}<input id="${id}" type="color" data-path="${path}" value="${esc(val)}"></div>`;
    case 'check': return `<div class="fld chk"><input id="${id}" type="checkbox" data-path="${path}" data-chk="1"${val?' checked':''}><label for="${id}">${esc(f.label)}</label></div>`;
    case 'select': return `<div class="fld">${L}<select id="${id}" data-path="${path}">${f.opts.map(o=>`<option value="${esc(o[0])}"${o[0]===val?' selected':''}>${esc(o[1])}</option>`).join('')}</select></div>`;
    case 'image': {
      const isData=/^data:/.test(val||'');
      return `<div class="fld"><label>${esc(f.label)}</label><div class="imgf">
        <div class="pv${f.square?' sq':''}" style="${val?`background-image:url('${esc(val)}')`:''}">${val?'':'ছবি নেই'}</div>
        <div class="row"><label class="abtn pri" style="cursor:pointer">📁 ছবি বাছাই করুন<input type="file" accept="image/*" hidden data-upload="${path}" data-max="${f.max||1400}" data-q="${f.q||''}" data-sq="${f.square?1:''}"></label>${val?`<button type="button" class="abtn red" data-act="imgclear" data-p="${path}">মুছুন</button>`:''}</div>
        ${isData?'':`<input type="text" inputmode="url" placeholder="অথবা ছবির লিংক (URL) দিন" data-path="${path}" value="${esc(val)}" style="padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;font-size:16px">`}
        ${f.hint?`<div class="adm-note" style="margin:0">${f.hint}</div>`:''}
      </div></div>`;
    }
    case 'pdf': {
      const isData=/^data:application\/pdf/.test(val||''); const kb=isData?Math.round(val.length*0.75/1024):0;
      return `<div class="fld"><label>${esc(f.label)}</label><div class="imgf">
        <div class="pv" style="height:auto;padding:12px;text-align:center">${isData?`✅ PDF সেট করা আছে (প্রায় ${kb} KB)`:(val?'🔗 লিংক দেওয়া আছে':'এখনও CV নেই')}</div>
        <div class="row"><label class="abtn gold" style="cursor:pointer">📄 PDF আপলোড করুন<input type="file" accept="application/pdf,.pdf" hidden data-uploadpdf="${path}"></label>${val?`<button type="button" class="abtn red" data-act="imgclear" data-p="${path}">মুছুন</button>`:''}</div>
        ${isData?'':`<input type="text" inputmode="url" placeholder="অথবা PDF-এর লিংক বা ফাইলের নাম (যেমন cv.pdf)" data-path="${path}" value="${esc(val)}" style="padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;font-size:16px">`}
        <div class="adm-note" style="margin:0">PDF ঘরে দিলে সাইটের "CV ডাউনলোড" বাটন থেকে সবাই নামাতে পারবে। ফাইল ২.৫ MB-এর কম রাখুন। খালি রাখলে বাটন পেজে দেখাবে না।</div>
      </div></div>`;
    }
    default: return `<div class="fld">${L}<input id="${id}" type="text" data-path="${path}" value="${esc(val)}">${hint}</div>`;
  }
}
function list(path,fields,titleKey,addLabel){
  const arr=getP(path)||[];
  return `<div class="lst">${arr.map((it,i)=>{
    const op = openState && openState.p===path && openState.i===i;
    return `<details class="it"${op?' open':''}><summary><span>${esc(it[titleKey]||'(খালি)')}</span><span class="ctl"><button type="button" data-act="up" data-p="${path}" data-i="${i}" aria-label="উপরে">↑</button><button type="button" data-act="down" data-p="${path}" data-i="${i}" aria-label="নিচে">↓</button><button type="button" class="d" data-act="del" data-p="${path}" data-i="${i}" aria-label="মুছুন">✕</button></span></summary><div class="in-body">${fields.map(f=>fld(`${path}.${i}.${f.k}`,f,it[f.k])).join('')}</div></details>`;
  }).join('')}<button type="button" class="abtn pri" data-act="add" data-p="${path}">＋ ${esc(addLabel||'নতুন যোগ করুন')}</button></div>`;
}

function buildAdmin(){
  if(adm) return adm;
  adm=document.createElement('aside'); adm.id='adm'; adm.setAttribute('aria-label','অ্যাডমিন প্যানেল');
  document.body.appendChild(adm);
  adm.addEventListener('input',onInput);
  adm.addEventListener('change',onChange);
  adm.addEventListener('click',onClick);
  return adm;
}
function showLogin(){
  buildAdmin();
  adm.innerHTML=`<div class="adm-head"><b>🔐 অ্যাডমিন লগইন</b></div>
  <div class="adm-login"><h3>স্বাগতম, ${esc(cfg.profile.name1)}</h3><p class="adm-note">পাসওয়ার্ড দিয়ে প্যানেল খুলুন।${cfg.adminHash?'':' <br>প্রথমবার পাসওয়ার্ড: <b>'+DEFAULT_PASS+'</b> (লগইনের পর সেটিংস থেকে অবশ্যই বদলে নিন)'}</p>
  <div class="fld"><label for="pw">পাসওয়ার্ড</label><input id="pw" type="password" autocomplete="current-password"></div>
  <button class="abtn pri full" data-act="login">প্রবেশ করুন</button></div>`;
  adm.classList.add('open');
  setTimeout(()=>$('#pw')&&$('#pw').focus(),50);

}
function doLogin(){
  const v=($('#pw').value||'');
  const ok = cfg.adminHash ? h53(v)===cfg.adminHash : v===DEFAULT_PASS;
  if(ok){ sessionStorage.setItem('fk_adm','1'); try{localStorage.setItem('fk_noTrack','1');}catch(e){} showPanel(); }
  else toast('পাসওয়ার্ড ভুল',true);
}
function showPanel(){
  buildAdmin();
  adm.innerHTML=`<div class="adm-head"><b>⚙ অ্যাডমিন প্যানেল</b><small id="admStat"></small><button class="adm-x pvbtn" data-act="preview" aria-label="প্রিভিউ" title="প্রিভিউ">👁</button><button class="adm-x" data-act="close" aria-label="বের হন" title="বের হন">⎋</button></div>

  <div class="adm-body" id="admBody"></div>`;
  adm.classList.add('open');
  paintTab();
}
function paintTab(keepScroll){
  const b=$('#admBody'); const y=keepScroll?b.scrollTop:0;
  b.innerHTML=tabHTML(curTab); b.scrollTop=y;
  $$('.adm-tabs button').forEach(x=>x.classList.toggle('on',x.dataset.tab===curTab));
  if(curTab==='dash' && ((cfg.analytics||{}).url||'').trim()) dashLoad();
}
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
function closeAdmin(){ sessionStorage.removeItem('fk_adm'); showLogin(); }

/* ---------- ইভেন্ট ---------- */
function onInput(e){
  const t=e.target; if(!t.dataset.path) return;
  if(t.type==='checkbox'||t.tagName==='SELECT'||t.type==='color'&&false) return;
  let v=t.value; if(t.dataset.num) v=v===''?0:Number(v);
  setP(t.dataset.path,v); changed();
}
function onChange(e){
  const t=e.target;
  if(t.dataset.path && (t.type==='checkbox'||t.tagName==='SELECT'||t.type==='color')){
    setP(t.dataset.path, t.type==='checkbox'?t.checked:t.value); changed(); return;
  }
  if(t.dataset.path && t.type==='text' && /\.img$|\.photo$/.test(t.dataset.path)){ keepOpen(t.dataset.path); paintTab(true); return; }
  if(t.dataset.upload){
    const f=t.files[0]; if(!f) return;
    readImg(f,+t.dataset.max||1400,!!t.dataset.sq,url=>{ setP(t.dataset.upload,url); keepOpen(t.dataset.upload); changed(); paintTab(true); },+t.dataset.q||0.8);
  }
  if(t.dataset.uploadpdf){
    const f=t.files[0]; if(!f) return;
    if(f.size>2.5*1024*1024) return toast('PDF বেশি বড় (২.৫ MB-এর কম দিন)',true);
    const fr=new FileReader(); fr.onload=()=>{ setP(t.dataset.uploadpdf,fr.result); changed(); paintTab(true); toast('CV সেট হয়েছে ✓'); }; fr.readAsDataURL(f); return;
  }
  if(t.dataset.import){
    const f=t.files[0]; if(!f) return;
    const fr=new FileReader(); fr.onload=()=>{ try{ const d=JSON.parse(fr.result); if(!d.profile||!d.banners) throw 0; cfg=d; persist(); updatePreview(); paintTab(); toast('ব্যাকআপ ফেরত এসেছে'); }catch(_){ toast('ফাইলটি সঠিক নয়',true);} }; fr.readAsText(f);
  }
}
function onClick(e){
  const tb=e.target.closest('[data-tab]'); if(tb){ curTab=tb.dataset.tab; openState=null; paintTab(); return; }
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, p=b.dataset.p, i=+b.dataset.i;
  if(b.closest('summary')) e.preventDefault();
  if(act==='close') return closeAdmin();
  if(act==='dashrefresh'){ if(!((cfg.analytics||{}).url||'').trim()) return toast('আগে Firebase URL দিন',true); return dashLoad(); }
  if(act==='copyrules'){ navigator.clipboard.writeText(RULES).then(()=>toast('কপি হয়েছে ✓'),()=>toast('কপি হয়নি, হাতে কপি করুন',true)); return; }
  if(act==='preview') return $('#pv').classList.add('open');
  if(act==='login') return doLogin();
  if(act==='add'){ const arr=getP(p); arr.push(JSON.parse(JSON.stringify(BLANK[p]))); openState={p,i:arr.length-1}; changed(); paintTab(true); const bd=$('#admBody'); bd.scrollTop=bd.scrollTop; return; }
  if(act==='del'){ if(!confirm('এটি মুছে ফেলবেন?')) return; getP(p).splice(i,1); openState=null; changed(); return paintTab(true); }
  if(act==='up'||act==='down'){ const a=getP(p), j=act==='up'?i-1:i+1; if(j<0||j>=a.length) return; [a[i],a[j]]=[a[j],a[i]]; openState={p,i:j}; changed(); return paintTab(true); }
  if(act==='imgclear'){ setP(p,''); keepOpen(p); changed(); return paintTab(true); }
  if(act==='setpw'){ const v=$('#newpw').value; if(v.length<4) return toast('কমপক্ষে ৪ অক্ষর দিন',true); cfg.adminHash=h53(v); $('#newpw').value=''; persist(); return toast('পাসওয়ার্ড বদলেছে ✓ — এখন ফাইল ডাউনলোড করে আপলোড করুন'); }
  if(act==='export') return save(new Blob([JSON.stringify(cfg,null,1)],{type:'application/json'}),'faruk-portfolio-backup.json');
  if(act==='download') return downloadSite(false);
  if(act==='download2') return downloadSite(true);
  if(act==='reset'){ if(!confirm('এই ব্রাউজারে করা সব পরিবর্তন মুছে ফাইলের আসল অবস্থায় ফিরবেন?')) return; localStorage.removeItem(KEY); location.reload(); }
}
function keepOpen(path){ const m=/^(.*)\.(\d+)\.[^.]+$/.exec(path); openState=m?{p:m[1],i:+m[2]}:null; }
function save(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500); }
function buildSite(c){ const d=JSON.stringify(c).replace(/</g,'\\u003c'); return SITE_TPL.replace('__SITE_DATA__',()=>d); }
function downloadSite(){
  cfg.updated=Date.now(); persist();
  save(new Blob([buildSite(cfg)],{type:'text/html'}),'index.html');
  toast('index.html ডাউনলোড হয়েছে — এটি হোস্টিং-এ আপলোড করুন');
}
/* ---------- লাইভ প্রিভিউ ---------- */
let pvReady=false;
function initPreview(){
  const f=$('#pvf'); f.onload=()=>{ pvReady=true; };
  f.srcdoc=buildSite(Object.assign({},cfg,{updated:Date.now()+86400000}));
}
function updatePreview(){
  const f=$('#pvf'); if(!f) return;
  try{
    if(!pvReady) throw 0;
    const w=f.contentWindow; w.__newCfg=cfg; w.eval('cfg=__newCfg; renderSite();');
  }catch(e){ pvReady=false; f.srcdoc=buildSite(Object.assign({},cfg,{updated:Date.now()+86400000})); }
}

   ভিজিটর ড্যাশবোর্ড
   ===================================================== */
const RULES='{\n  "rules": {\n    "visits": {\n      ".read": true,\n      "$id": { ".write": "!data.exists()" }\n    }\n  }\n}';
function dashTab(){
  cfg.analytics=cfg.analytics||{url:''};
  const has=!!(cfg.analytics.url||'').trim();
  return `<div class="dash-top"><b>ভিজিটর ড্যাশবোর্ড</b><button type="button" class="abtn pri" data-act="dashrefresh">⟳ রিফ্রেশ</button></div>
  <div id="dashOut">${has?'':'<div class="dash-err" style="border-color:var(--line);background:rgba(255,255,255,.05);color:var(--text)">এখনও সংযোগ দেওয়া হয়নি। নিচের ৪টি ধাপ একবার করে নিলেই ভিজিটর গোনা শুরু হবে।</div>'}</div>
  <details class="it" ${has?'':'open'} style="margin-top:6px"><summary><span>⚙ সংযোগ সেটআপ (Firebase – ফ্রি)</span></summary><div class="in-body">
    <ol class="steps">
      <li><b>console.firebase.google.com</b>-এ Google একাউন্ট দিয়ে ঢুকে “Add project” করুন (Analytics বন্ধ রাখতে পারেন)।</li>
      <li>বাঁ মেনু থেকে <b>Build → Realtime Database → Create Database</b> চাপুন, যেকোনো লোকেশন বেছে নিন।</li>
      <li><b>Rules</b> ট্যাবে গিয়ে আগের লেখা মুছে নিচের কোড বসিয়ে <b>Publish</b> করুন।</li>
      <li>Data ট্যাবের উপরের লিংকটি (যেমন https://xxxx-default-rtdb.firebaseio.com) কপি করে নিচের ঘরে বসান।</li>
    </ol>
    <pre class="rules">${esc(RULES)}</pre>
    <button type="button" class="abtn full" data-act="copyrules">📋 Rules কোড কপি করুন</button>
    ${fld('analytics.url',{label:'Firebase Database URL',hint:'সেট করার পর অবশ্যই সেটিংস থেকে <b>index.html ডাউনলোড</b> করে নতুন ফাইল হোস্টিং-এ আপলোড করুন, নইলে গণনা শুরু হবে না।'},cfg.analytics.url)}
    <p class="adm-note">কী গোনা হয়: ভিজিটের সময়, কোন ডিভাইস (মোবাইল/কম্পিউটার), কোথা থেকে এসেছে। কারও নাম, IP বা ব্যক্তিগত তথ্য রাখা হয় না। একই ব্রাউজার সেশনে রিফ্রেশ করলে বারবার গোনা হয় না। আপনি অ্যাডমিনে লগইন করা ব্রাউজার থেকে ঢুকলে সেটা গোনা হয় না।</p>
  </div></details>`;
}
function dayKey(t){const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
async function dashLoad(){
  const out=$('#dashOut'); if(!out) return;
  const base=((cfg.analytics||{}).url||'').trim().replace(/\/+$/,'');
  out.innerHTML='<p class="adm-note">লোড হচ্ছে…</p>';
  try{
    const r=await fetch(base+'/visits.json?orderBy=%22%24key%22&limitToLast=10000',{cache:'no-store'});
    if(r.status===401||r.status===403) throw new Error('পড়ার অনুমতি নেই — Rules কোডটি ঠিকভাবে Publish করেছেন কি না দেখুন।');
    if(!r.ok) throw new Error('সার্ভার সাড়া দেয়নি ('+r.status+') — URL ঠিক আছে কি না দেখুন।');
    const j=await r.json()||{};
    const rows=Object.values(j).filter(x=>x&&x.t);
    if($('#dashOut')) $('#dashOut').innerHTML=dashHTML(rows);
  }catch(e){
    if($('#dashOut')) $('#dashOut').innerHTML='<div class="dash-err"><b>ডেটা আনা যায়নি।</b><br>'+esc(e.message&&!/Failed to fetch/.test(e.message)?e.message:'ইন্টারনেট বা URL-এ সমস্যা আছে। URL-টি https:// দিয়ে শুরু ও .firebaseio.com দিয়ে শেষ হওয়া উচিত।')+'</div>';
  }
}
function dashHTML(rows){
  const now=Date.now(), DAY=864e5;
  const inLast=d=>rows.filter(x=>now-x.t<d*DAY);
  const uniq=a=>new Set(a.map(x=>x.v||x.t)).size;
  const today=rows.filter(x=>dayKey(x.t)===dayKey(now));
  const byDay={}; rows.forEach(x=>{const k=dayKey(x.t);byDay[k]=(byDay[k]||0)+1;});
  const days=[]; for(let i=13;i>=0;i--){ const t=now-i*DAY; days.push({k:dayKey(t),d:new Date(t).getDate(),n:byDay[dayKey(t)]||0}); }
  const max=Math.max(1,...days.map(x=>x.n));
  const src={}; rows.forEach(x=>{const k=x.r||'সরাসরি / অজানা'; src[k]=(src[k]||0)+1;});
  const srcL=Object.entries(src).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const mob=rows.filter(x=>x.d==='m').length, desk=rows.length-mob;
  const pct=n=>rows.length?Math.round(n*100/rows.length):0;
  const hb=(l,n,tot)=>`<div class="hbar"><span title="${esc(l)}">${esc(l)}</span><div class="tr"><i style="width:${tot?Math.max(3,n*100/tot):0}%"></i></div><span>${bn(n)}</span></div>`;
  const recent=[...rows].sort((a,b)=>b.t-a.t).slice(0,8).map(x=>`<div><span>${esc(new Date(x.t).toLocaleString('bn-BD',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}))}</span><span>${x.d==='m'?'📱':'💻'} ${esc(x.r||'সরাসরি')}</span></div>`).join('');
  if(!rows.length) return '<div class="dash-err" style="border-color:var(--line);background:rgba(255,255,255,.05);color:var(--text)">সংযোগ ঠিক আছে ✓ তবে এখনও কোনো ভিজিট রেকর্ড হয়নি। প্রকাশিত সাইটে অন্য কোনো ব্রাউজার থেকে একবার ঢুকে আবার রিফ্রেশ করুন।</div>';
  return `<div class="kpis">
    <div class="kpi"><small>মোট ভিজিট</small><b>${bn(rows.length)}</b></div>
    <div class="kpi g"><small>ইউনিক ভিজিটর</small><b>${bn(uniq(rows))}</b></div>
    <div class="kpi c"><small>আজ</small><b>${bn(today.length)}</b></div>
    <div class="kpi"><small>গত ৭ দিন</small><b>${bn(inLast(7).length)}</b></div>
    <div class="kpi"><small>গত ৩০ দিন</small><b>${bn(inLast(30).length)}</b></div>
    <div class="kpi g"><small>৩০ দিনে ইউনিক</small><b>${bn(uniq(inLast(30)))}</b></div>
  </div>
  <div class="dbox"><h5>গত ১৪ দিনের ভিজিট</h5><div class="chart">${days.map(x=>`<div class="col" title="${x.k}: ${x.n}"><em>${x.n?bn(x.n):''}</em><div class="bar" style="height:${x.n*100/max*0.8}%"></div><span>${bn(x.d)}</span></div>`).join('')}</div></div>
  <div class="dbox"><h5>কোথা থেকে এসেছে</h5>${srcL.map(([l,n])=>hb(l,n,rows.length)).join('')}</div>
  <div class="dbox"><h5>ডিভাইস</h5>${hb('📱 মোবাইল '+bn(pct(mob))+'%',mob,rows.length)}${hb('💻 কম্পিউটার '+bn(pct(desk))+'%',desk,rows.length)}</div>
  <div class="dbox"><h5>সাম্প্রতিক ভিজিট</h5><div class="recent">${recent}</div></div>
  <p class="adm-note">সর্বশেষ ১০,০০০ ভিজিট পর্যন্ত দেখানো হয়। সময় আপনার ডিভাইসের সময় অনুযায়ী।</p>`;
}
function readImg(file,max,square,cb,q){
  const fr=new FileReader();
  fr.onload=()=>{ const im=new Image(); im.onload=()=>{
    let sx=0,sy=0,sw=im.width,sh=im.height,w,h;
    if(square){ const s=Math.min(sw,sh); sx=(sw-s)/2; sy=(sh-s)/2; sw=sh=s; w=h=Math.min(s,max); }
    else { const k=Math.min(1,max/sw); w=Math.round(sw*k); h=Math.round(sh*k); }
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    const g=cv.getContext('2d'); g.fillStyle='#000'; g.fillRect(0,0,w,h); g.drawImage(im,sx,sy,sw,sh,0,0,w,h);
    cb(cv.toDataURL('image/jpeg',q||.8));
  }; im.onerror=()=>toast('ছবিটি পড়া যায়নি',true); im.src=fr.result; };
  fr.readAsDataURL(file);
}
